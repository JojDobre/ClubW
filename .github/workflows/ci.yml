# Umiestnenie: .github/workflows/ci.yml
# Automatická kontrola pri každom commite a pull requeste.
#
# PREČO: projekt mal 0 testov a žiadnu automatickú kontrolu. Chyby ako
# nefunkčný build alebo duplicitný názov indexu sa dali odhaliť až pri
# nasadení. Tento workflow spustí kompiláciu, testy aj migrácie skôr,
# než sa zmeny dostanú do hlavnej vetvy.

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      # Skutočná databáza - migrácie a integračné testy proti nej bežia
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: clubw_test
        ports:
          - 5432:5432
        # Práca sa začne až vtedy, keď je databáza pripravená
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: clubw_test
      DB_USER: test_user
      DB_PASSWORD: test_password
      JWT_SECRET: ci_only_secret_nie_je_produkcny
      LICENSE_CHECK_DISABLED: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Inštalácia závislostí
        run: npm ci

      - name: Kontrola typov
        run: npm run build --workspace=backend

      - name: Migrácie na čistej databáze
        working-directory: backend
        run: npx sequelize-cli db:migrate

      - name: Rollback a opätovné spustenie migrácií
        # Overí, že sa každá migrácia dá vrátiť späť. Bez tejto kontroly
        # by sa chyba v down() zistila až vtedy, keď treba niečo vrátiť.
        working-directory: backend
        run: |
          npx sequelize-cli db:migrate:undo:all
          npx sequelize-cli db:migrate

      - name: Testy
        working-directory: backend
        run: npm test

      - name: Preklady hlášok (cs, en)
        working-directory: backend
        run: npm run preklady -- --kontrola

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Inštalácia závislostí
        run: npm ci

      - name: Kontrola typov
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Preklady administrácie a šablón (cs, en, pl, de, es, fr)
        working-directory: frontend
        run: npm run preklady -- --kontrola

      - name: Jednotkové testy
        working-directory: frontend
        run: npm test

      - name: Produkčný build
        working-directory: frontend
        run: npx vite build

  e2e:
    name: Testy v prehliadači (šablóny a administrácia)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: clubw_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: development
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: clubw_e2e
      DB_USER: test_user
      DB_PASSWORD: test_password
      JWT_SECRET: ci_only_secret_nie_je_produkcny
      LICENSE_CHECK_DISABLED: 'true'
      E2E_EMAIL: e2e@test.sk
      E2E_HESLO: modra lavica pri tichom rybniku
      E2E_API: http://127.0.0.1:3100
      E2E_URL: http://127.0.0.1:4173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Inštalácia závislostí
        run: npm ci

      - name: Databáza a správca
        working-directory: backend
        run: |
          npx sequelize-cli db:migrate
          npx tsx scripts/vytvor-spravcu.ts --email "$E2E_EMAIL" --meno "E2E Správca" --heslo "$E2E_HESLO"

      - name: Spustenie backendu
        working-directory: backend
        run: |
          PORT=3100 nohup npx tsx src/index.ts > ../backend-e2e.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3100/health && exit 0; sleep 1; done
          cat ../backend-e2e.log; exit 1

      - name: Produkčný build webu a náhľad
        working-directory: frontend
        run: |
          npx vite build
          API_PROXY=http://127.0.0.1:3100 nohup npx vite preview --port 4173 --host 127.0.0.1 > ../preview-e2e.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && exit 0; sleep 1; done
          cat ../preview-e2e.log; exit 1

      - name: Demo dáta
        working-directory: frontend
        run: npm run e2e:data

      - name: Prehliadač Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Testy
        working-directory: frontend
        run: npm run test:e2e

      - name: Výsledky pri chybe
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-vysledky
          path: |
            frontend/e2e-report
            frontend/e2e-vysledky
            backend-e2e.log
          retention-days: 7

  license-server:
    name: Licenčný server
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: clubw_licenses_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: clubw_licenses_test
      DB_USER: test_user
      DB_PASSWORD: test_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Inštalácia závislostí
        run: npm ci

      - name: Kontrola typov
        run: npm run build --workspace=license-server

      - name: Migrácie, rollback a opätovné spustenie
        working-directory: license-server
        run: |
          npx sequelize-cli db:migrate
          npx sequelize-cli db:migrate:undo:all
          npx sequelize-cli db:migrate

      - name: Testy (API, prihlásenie, podpisy, aktualizácie)
        working-directory: license-server
        run: npm test

      - name: Webová administrácia (typy + build)
        run: npm run build --workspace=@clubw/license-admin

  docker:
    name: Docker obraz licenčného servera
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Zostavenie obrazu
        run: docker build -f license-server/Dockerfile -t clubw-licencie:ci .

      - name: Kontrola docker compose
        working-directory: deploy/licencny-server
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci/; s/^LICENSE_PRIVATE_KEY=.*/LICENSE_PRIVATE_KEY=x/; s/^LICENSE_PUBLIC_KEY=.*/LICENSE_PUBLIC_KEY=x/' .env
          docker compose config --quiet
