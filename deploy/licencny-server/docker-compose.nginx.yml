# Umiestnenie: deploy/licencny-server/docker-compose.nginx.yml
# Variant pre VPS, kde už porty 80 a 443 drží nginx (iné weby na tom istom
# serveri). Caddy sa nespúšťa, licenčný server počúva len na 127.0.0.1
# a HTTPS mu robí existujúci nginx s certifikátom z certbotu.
#
# Zapne ho ./priprav.sh ... --nginx (do .env zapíše COMPOSE_FILE),
# takže docker compose, zaloha.sh aj aktualizuj.sh ho použijú samy.
# Konfigurácia nginx: nginx-licencie.conf, postup: NASADENIE.md (časť nginx).

services:
  licencny-server:
    # Len localhost - Docker publikované porty obchádza ufw, preto nikdy 0.0.0.0
    ports:
      - '127.0.0.1:${PORT_SERVERA:-3101}:3001'

  caddy:
    # Nespúšťa sa - HTTPS vybavuje nginx na hostiteľovi
    profiles: ['caddy']
