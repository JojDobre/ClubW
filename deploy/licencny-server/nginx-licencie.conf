# Umiestnenie: deploy/licencny-server/nginx-licencie.conf
# Stránka nginx pre licenčný server (variant docker-compose.nginx.yml).
#
#   sudo cp nginx-licencie.conf /etc/nginx/sites-available/licencie
#   sudo sed -i 's/licencie.vasadomena.sk/VASA_DOMENA/' /etc/nginx/sites-available/licencie
#   sudo ln -s /etc/nginx/sites-available/licencie /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d VASA_DOMENA        # doplní HTTPS a presmerovanie
#
# Port 3101 musí sedieť s PORT_SERVERA v .env (predvolene 3101).

server {
    listen 80;
    listen [::]:80;
    server_name licencie.vasadomena.sk;

    # API prijíma len malé JSON požiadavky (sťahovanie balíkov sa to netýka)
    client_max_body_size 1m;
    # Prehliadač ho berie do úvahy až cez HTTPS (po certbote)
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Príprava balíka verzie z GitHubu môže chvíľu trvať
        proxy_read_timeout 300s;
    }
}
